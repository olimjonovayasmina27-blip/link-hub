version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sports_admin
      POSTGRES_PASSWORD: secure_db_password_123
      POSTGRES_DB: sports_nutrition_prod
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api_backend:
    build: .
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      # Automatically maps onto postgres_db
      DATABASE_URL: postgresql://sports_admin:secure_db_password_123@postgres_db:5432/sports_nutrition_prod?schema=public
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - postgres_db

volumes:
  pgdata_prod:
